[project]
name = "brav-backend"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "dj-database-url>=3.1.2",
    "dj-rest-auth[with-social]>=7.2.0",
    "django>=6.1.1",
    "django-allauth[socialaccount]>=65.19.7",
    "django-cors-headers>=4.9.0",
    "djangorestframework>=3.18.1",
    "djangorestframework-simplejwt>=5.5.1",
    "drf-spectacular>=0.30.0",
    "gunicorn>=27.0.0",
    "psycopg[binary]>=3.3.8",
    "python-dotenv>=1.2.4",
    "whitenoise>=6.12.0",
]

[tool.ruff.lint]
# Enable the standard rules plus the Django-specific plugin (DJ)
extend-select = [
    "DJ",   # flake8-django (catches Django-specific bugs)
    "E",    # pycodestyle errors
    "W",    # pycodestyle warnings
    "F",    # Pyflakes
    "I",    # isort (automatically sorts imports)
    "B",    # flake8-bugbear
    "UP",   # pyupgrade
]

[tool.ruff.lint.per-file-ignores]
# Ignore long lines and specific mutable rules in auto-generated migrations
"**/migrations/*.py" = ["E501", "RUF012"]
# Ignore unused imports or wildcard imports in settings
"**/settings.py" = ["E501", "F403", "F405"]
# Allow assert statements in tests
"**/tests.py" = ["S101"]
"**/test_*.py" = ["S101"]


[tool.pyright]
reportMissingTypeStubs = false
